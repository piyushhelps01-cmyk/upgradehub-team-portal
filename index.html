<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upgrade Hub - Team Portal</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        h1 { margin: 0; color: var(--accent); font-size: 24px; }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            background: var(--card-bg);
            border: 1px solid #334155;
            color: var(--text-sub);
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .tab-btn.active {
            background: var(--accent);
            color: #000;
        }

        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #334155;
            margin-bottom: 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
        }

        label { display: block; margin-bottom: 5px; color: var(--text-sub); font-size: 14px; }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            color: white;
            box-sizing: border-box;
            margin-bottom: 15px;
        }

        button.btn-submit {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }

        .status-badge {
            background: #0284c7;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Upgrade Hub Team Portal</h1>
        <div><span class="status-badge">Phase 1 Active</span></div>
    </header>

    <!-- Navigation Tabs -->
    <div class="tabs">
        <button class="tab-btn active">Dashboard & Tasks</button>
        <button class="tab-btn">Daily Report</button>
        <button class="tab-btn">Team Directory</button>
    </div>

    <!-- Task Dashboard Section -->
    <div class="card">
        <h3>Active Tasks</h3>
        <div class="grid">
            <div style="background:#0f172a; padding:15px; border-radius:8px;">
                <strong>Task: Team Portal Implementation</strong>
                <p style="color:#94a3b8; font-size:13px;">Build 4-Tab Portal with Supabase Backend Integration</p>
                <p>Assigned To: <b>Piyush Yadav</b></p>
                <p>Status: <span style="color:#38bdf8;">In Progress</span></p>
            </div>
        </div>
    </div>

    <!-- Daily Progress Report Form -->
    <div class="card">
        <h3>Submit Daily Work Report</h3>
        <form id="reportForm">
            <label>Member Name</label>
            <input type="text" value="Piyush Yadav" readonly>

            <label>Role / Designation</label>
            <input type="text" value="Data Store & Privacy Manager" readonly>

            <label>Today's Completed Work</label>
            <textarea rows="3" placeholder="Describe completed tasks..."></textarea>

            <label>Today's Progress (%)</label>
            <input type="number" placeholder="100">

            <button type="button" class="btn-submit">Submit Progress Report</button>
        </form>
    </div>
</div>

</body>
</html>
